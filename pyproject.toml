[project]
name = "sthira"
version = "0.1.0"
description = "A local ledger of what you decided with AI. Warns when new work contradicts it, and learns from your corrections."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "httpx>=0.27",
    "pydantic>=2.6",
    "fastapi>=0.110",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
mcp = [
    "mcp>=1.2",
]
web = ["uvicorn>=0.29"]
desktop = [
    "pywebview>=5",
]

[project.scripts]
sthira = "sthira.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sthira"]

[tool.vercel]
entrypoint = "web.app:app"
